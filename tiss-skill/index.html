<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TISS 內部 Claude Code Skill 使用說明清單">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Skill 使用說明｜TISS</title>
  <style>
    :root { --orange:#f36f21; --ink:#272b30; --muted:#68717d; --line:#e4e7eb; --soft:#f5f6f7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--soft); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.6; }
    main { width:min(920px,calc(100% - 32px)); margin:64px auto; }
    .mark { display:inline-grid; place-items:center; width:42px; height:42px; border-radius:11px; background:var(--orange); color:#fff; font-weight:800; font-size:14px; }
    h1 { margin:16px 0 6px; font-size:30px; }
    p { margin:0 0 28px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
    .card { display:block; padding:24px; border:1px solid var(--line); border-radius:14px; background:#fff; color:inherit; text-decoration:none; box-shadow:0 5px 22px rgba(28,34,40,.06); }
    .card:hover { border-color:var(--orange); transform:translateY(-1px); }
    .card strong { display:block; margin-bottom:7px; font-size:17px; }
    .card span { color:var(--muted); font-size:14px; }
    footer { margin-top:30px; color:#8a929b; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <span class="mark">TISS</span>
    <h1>Skill 使用說明</h1>
    <p>TISS 內部 Claude Code skill 的操作手冊。</p>
    <div class="grid">
      <a class="card" href="./procurement-deck/"><strong>procurement-deck</strong><span>採購案一評簡報產生器／版型與工作流程</span></a>
    </div>
    <footer>請選擇項目以查看完整說明。</footer>
  </main>
</body>
</html>
