<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TISS 靜態 HTML 預覽清單">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>TISS 靜態預覽</title>
  <style>
    :root { --orange:#f36f21; --ink:#272b30; --muted:#68717d; --line:#e4e7eb; --soft:#f5f6f7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--soft); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.6; }
    main { width:min(880px,calc(100% - 32px)); margin:64px auto; }
    header { margin-bottom:28px; }
    .mark { display:inline-grid; place-items:center; width:42px; height:42px; border-radius:11px; background:var(--orange); color:#fff; font-weight:800; font-size:14px; }
    h1 { margin:16px 0 6px; font-size:30px; }
    p { margin:0; color:var(--muted); }
    h2 { margin:34px 0 14px; font-size:17px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
    .card { display:block; padding:22px; border:1px solid var(--line); border-radius:14px; background:#fff; color:inherit; text-decoration:none; box-shadow:0 5px 22px rgba(28,34,40,.06); }
    .card:hover { border-color:var(--orange); transform:translateY(-1px); }
    .card strong { display:block; margin-bottom:6px; }
    .card span { color:var(--muted); font-size:14px; }
    footer { margin-top:30px; color:#8a929b; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="mark">TISS</span>
      <h1>靜態 HTML 預覽</h1>
      <p>供同事檢視工作成果的公開預覽頁面。</p>
    </header>
    <section aria-labelledby="recruiting-title">
      <h2 id="recruiting-title">人才招募</h2>
      <div class="grid">
        <a class="card" href="./recruiting/project-manager/"><strong>專案管理師</strong><span>運動科技／數位平台／委外專案</span></a>
        <a class="card" href="./recruiting/product-manager/"><strong>Data Product Manager</strong><span>運動數據平台</span></a>
        <a class="card" href="./recruiting/qa-engineer/"><strong>軟體測試／QA 工程師</strong><span>Web／API／平台驗收</span></a>
      </div>
    </section>
    <footer>公開連結僅供預覽；請勿放置機密、個資或未授權內容。</footer>
  </main>
</body>
</html>
