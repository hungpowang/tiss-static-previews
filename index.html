<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TISS 靜態頁面">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>TISS</title>
  <style>
    :root { --orange:#f36f21; --ink:#272b30; --muted:#68717d; --soft:#f5f6f7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--soft); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
    main { width:min(520px,calc(100% - 32px)); padding:48px 32px; text-align:center; }
    .mark { display:inline-grid; place-items:center; width:44px; height:44px; border-radius:12px; background:var(--orange); color:#fff; font-weight:800; font-size:14px; }
    h1 { margin:20px 0 8px; font-size:28px; }
    p { margin:0; color:var(--muted); line-height:1.7; }
  </style>
</head>
<body>
  <main>
    <span class="mark">TISS</span>
    <h1>頁面未提供</h1>
    <p>請使用收到的完整分享網址開啟內容。</p>
  </main>
</body>
</html>
